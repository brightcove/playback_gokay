name: ci

# Port of .ci/Jenkinsfile (Jenkins TestOnlyPipeline job playback/gokay/test-only).
# Same stages, same commands, same order: go mod download, then make (default
# target: build test).
#
# Jenkins is untouched and keeps running until the owner retires the job.
#
# This repository is PUBLIC, so it cannot reference the private
# brightcove/cd_workflows go-setup action the private playback libraries use
# (GitHub resolves actions at parse time and reports "not found"). It does not
# need it: every dependency here is public, so plain setup-go covers the
# "prepare the module access" stage without an App token.
#
# There is deliberately no scanner job: the org-level Wiz GitHub App already runs
# IaC, SAST, secret and vulnerability scans on every PR here.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Go from go.mod, as the golang:1.26 agent image did.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Jenkins ran this in its "Prepare test environment" stage: gokay shells out
      # to git, and the Jenkins agent needed the workspace declared safe.
      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$(pwd)"

      # Jenkins "Prepare test environment": go mod download.
      - name: Download modules
        run: go mod download

      # Jenkins "Run Tests": make (all: build test).
      - name: Build and test
        run: make
